[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphalayer"
version = "0.1.0"
description = "A compositing framework for AI skills — Skill, Layer, Flow — for piping automations programmatically."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Connor O'Dea" }]
keywords = ["ai", "agents", "pipeline", "workflow", "automation", "llm", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Core is dependency-free by design: Artifact/Layer/Flow mechanics and the CLI never require
# a specific LLM vendor SDK. Backends that need one live behind extras (see [project.optional-dependencies]).
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/connorodea/alphalayer"
Repository = "https://github.com/connorodea/alphalayer"
Issues = "https://github.com/connorodea/alphalayer/issues"

[project.scripts]
alphalayer = "alphalayer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
